\* Journaled pull, one execution, every fault: pause, partition, lost poll
\* responses and ack replies, drain, abort; n2's clock four ticks ahead.
CONSTANTS
    n1 = n1  n2 = n2  x1 = x1  x2 = x2  None = None
    Nodes <- MCNodes
    Execs <- MCExecsOne
    Skew <- MCSkewAhead
    TTL = 2
    RenewEvery = 1
    AckDeadline = 1
    CallDeadline = 2
    DispatchDeadline = 3
    MaxTime = 4
    MaxEpoch = 2
    MaxTokens = 2
    Faults = {"pause", "partition", "lose", "drain", "abort"}
SYMMETRY MCSymmetry
INIT Init
NEXT Next
INVARIANTS TypeOK S1_OneRunPerClaim S2_FencedHistory S3_NoStaleIntent S3_ExecutedWereJournaled S3a_AtMostOnce S5_NoLiveSteal S6_OneOutcome
