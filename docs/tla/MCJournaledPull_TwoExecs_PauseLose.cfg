\* Journaled pull, two executions sharing the relay and the token counter; faults: "pause", "lose".
\* Horizon MaxTime 2: the product of two executions at MaxTime 3 does not finish
\* (section 4). DispatchDeadline 2 keeps the UNAVAILABLE sweep inside the horizon.
CONSTANTS
    n1 = n1  n2 = n2  x1 = x1  x2 = x2  None = None
    Nodes <- MCNodes
    Execs <- MCExecs
    Skew <- MCSkewAhead
    TTL = 2
    RenewEvery = 1
    AckDeadline = 1
    CallDeadline = 2
    DispatchDeadline = 2
    MaxTime = 2
    MaxEpoch = 2
    MaxTokens = 3
    Faults = {"pause", "lose"}
SYMMETRY MCSymmetryAll
INIT Init
NEXT Next
INVARIANTS TypeOK S1_OneRunPerClaim S2_FencedHistory S3_NoStaleIntent S3_ExecutedWereJournaled S3a_AtMostOnce S5_NoLiveSteal S6_OneOutcome
